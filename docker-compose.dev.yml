# Usage: this file lives in PID-Infra, which sits alongside PID-Front
# and PID-Back under the same parent folder. From inside
# PID-Infra, run:
#   docker compose -f docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"   
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  backend:
    build:
      context: ../PID-Back
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://appuser:devpassword@postgres:5432/appdb
      NODE_ENV: development
      # Dev-only placeholder. Generate a real secret per environment:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      COOKIE_SECRET: 3db1ffb95e688d1c849d4eef3d88c9bb1f4e5ba879e9e9fd380f70fdf3a9c12e
    volumes:
      - ../PID-Back:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ../PID-Front
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # Points the Vite dev proxy at the backend container instead of the
      # 127.0.0.1 default, which only works outside Docker.
      VITE_BACKEND_URL: http://backend:4000
    volumes:
      - ../PID-Front:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata_dev: